spring.application.name=order-service

server.port=8080
server.servlet.context-path=/api/orders

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s

# Legacy MySQL datasource settings commented out while migrating to MongoDB
# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-service:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_URI:mongodb://mongo-service:27017/order_db}}
# Legacy env var kept for reference:
# spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongo-service:27017/order_db}


# Who may call this API: a sign-in token from user-service (JWT, RS256),
# checked against the public keys user-service publishes. Only GET /status
# (the synthetic check) and actuator are open. Same namespace, so the short
# Service name works in every environment.
app.jwt.jwks-uri=${JWT_JWKS_URI:http://user-service/api/auth/jwks.json}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo

# API request log (web/RequestLoggingFilter). Request payloads are logged only
# where an environment opts in: NEVER (default) | ERRORS (4xx/5xx only) |
# ALWAYS, set per environment with APP_HTTP_LOGGING_REQUEST_BODY. Secret
# fields are masked; response bodies are never logged.
app.http-logging.request-body=NEVER
app.http-logging.max-body-length=2048

# Order events (roadmap steps 12-13): an OrderCreated event on topic orders
# for every new order, through the transactional outbox (outbox/). Off
# unless the environment runs Kafka (gitops values set APP_EVENTS_ENABLED=true
# and the connection: SPRING_KAFKA_BOOTSTRAP_SERVERS,
# SPRING_KAFKA_SECURITY_PROTOCOL and the SSL bundle SPRING_KAFKA_SSL_BUNDLE=kafka,
# SPRING_SSL_BUNDLE_PEM_KAFKA_*, from the KafkaAccess Secret).
app.events.enabled=false
app.events.orders-topic=orders
app.events.outbox.poll-interval=500ms
app.events.outbox.batch-size=100
spring.kafka.bootstrap-servers=localhost:9092
# Topics are KafkaTopic resources in the gitops repo, never created here.
spring.kafka.admin.auto-create=false
# Durable and never duplicated: wait for all in-sync replicas, and let the
# broker drop a retried send it already has (idempotence).
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# The relay waits at most this long for Kafka metadata when Kafka is
# unreachable, instead of the client's default 60s.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=30000
# Values are Avro, with the schema in the registry (gitops
# streaming/base/schema-registry.yaml, through its Confluent-compatible API).
# The serializer registers OrderCreated.avsc on first use; the registry
# rejects a version that isn't backward compatible, and the relay then keeps
# the event and alerts. avro.remove.java.properties keeps Java-only hints out
# of the registered schema, so other languages read it unchanged.
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.producer.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://schema-registry.kafka.svc:8080/apis/ccompat/v7}
spring.kafka.producer.properties.auto.register.schemas=true
spring.kafka.producer.properties.avro.remove.java.properties=true
