# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
spring.data.mongodb.uri=${MONGO_URI:mongodb://mongo-service:27017/order_db}
# Legacy env var kept for reference:
# spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongo-service:27017/order_db}


server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readiness,mongo