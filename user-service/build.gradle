plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
	// Java classes from the Avro schemas in src/main/avro.
	id 'com.github.davidmc24.gradle.plugin.avro' version '1.9.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	// The Avro serializer that talks to the schema registry (Apache 2.0).
	maven { url = uri('https://packages.confluent.io/maven/') }
}

avro {
	stringType = 'String'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Legacy JPA/MySQL dependency commented out while migrating to MongoDB
	// implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	// runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.kafka:spring-kafka'
	// 7.8.x: the line built against kafka-clients 3.8 (Spring Boot 3.4's).
	implementation 'io.confluent:kafka-avro-serializer:7.8.9'
	// Amazon MSK's IAM sign-in (roadmap step 14): used only where the
	// environment points the service at MSK (gitops chart kafka.msk).
	runtimeOnly 'software.amazon.msk:aws-msk-iam-auth:2.3.9'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
	implementation 'io.opentelemetry:opentelemetry-api'
	// Database migrations (roadmap step 24, migrations/Migrate.java and
	// db/migration): Flyway and its MongoDB connector, run as their own
	// command before a release.
	implementation 'org.flywaydb:flyway-core:13.12.1'
	implementation 'org.flywaydb:flyway-database-nc-mongodb:13.12.1'
	// The connector's commands are plugins of their own.
	runtimeOnly 'org.flywaydb:flyway-verb-migrate:13.12.1'
	runtimeOnly 'org.flywaydb:flyway-verb-validate:13.12.1'
	runtimeOnly 'org.flywaydb:flyway-verb-info:13.12.1'
	runtimeOnly 'org.flywaydb:flyway-verb-baseline:13.12.1'
	runtimeOnly 'org.flywaydb:flyway-verb-repair:13.12.1'
	runtimeOnly 'org.flywaydb:flyway-nc-scanners:13.12.1'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
	dependencies {
		// Flyway 13 (above) uses annotations newer than Spring Boot 3.4's Jackson
		// 2.18. Annotations only, and compatible upward: the rest of Jackson
		// stays at Spring Boot's version.
		dependency 'com.fasterxml.jackson.core:jackson-annotations:2.22'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
