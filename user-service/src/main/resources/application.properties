spring.application.name=demo
spring.profiles.active=dev

server.servlet.context-path=/api

management.endpoint.health.show-details=always

order.service.url=${ORDER_SERVICE_URL:http://backend-order}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readiness,mongo
management.endpoints.web.exposure.include=health,info,prometheus
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{traceId}] %logger{36} - %msg%n