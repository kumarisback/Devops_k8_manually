spring.application.name=user-service
spring.profiles.active=dev

server.servlet.context-path=/api

management.endpoint.health.show-details=always

order.service.url=${ORDER_SERVICE_URL:http://backend-order}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [trace_id=%X{trace_id} span_id=%X{span_id}] %logger{36} - %msg%n
