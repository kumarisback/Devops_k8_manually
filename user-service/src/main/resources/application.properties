spring.application.name=user-service

server.servlet.context-path=/api

management.endpoint.health.show-details=always

order.service.url=${ORDER_SERVICE_URL:http://backend-order}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_URI:mongodb://mongo-service:27017/user_db}}

# Sign-in tokens: JWTs signed with RS256. Only this service holds the private
# key and signs; other services verify tokens with the public key published
# at /api/auth/jwks.json, so none of them could forge one. The key comes from
# the jwt-signing-key Secret (PKCS#8 PEM). There is no default: without a key
# the service refuses to start rather than sign with a known one.
app.jwt.signing-key=${JWT_SIGNING_KEY}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo
management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s

# API request log (web/RequestLoggingFilter). Request payloads are logged only
# where an environment opts in: NEVER (default) | ERRORS (4xx/5xx only) |
# ALWAYS, set per environment with APP_HTTP_LOGGING_REQUEST_BODY. Secret
# fields are masked; response bodies are never logged.
app.http-logging.request-body=NEVER
app.http-logging.max-body-length=2048

# User events (roadmap step 12): a UserRegistered event on topic users for
# every sign-up. Off unless the environment runs Kafka; the connection comes
# from the environment the same way as order-service's (see its
# application.properties).
app.events.enabled=false
app.events.users-topic=users
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=30000
