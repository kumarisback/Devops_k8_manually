spring.application.name=notification-service

server.port=8080

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# Kafka (roadmap step 12). In Kubernetes the connection comes from the
# environment: SPRING_KAFKA_BOOTSTRAP_SERVERS, SPRING_KAFKA_SECURITY_PROTOCOL
# and an SSL bundle (SPRING_KAFKA_SSL_BUNDLE=kafka, SPRING_SSL_BUNDLE_PEM_KAFKA_*)
# filled from the KafkaAccess Secret in the gitops repo.
spring.kafka.bootstrap-servers=localhost:9092
# Topics are declared as KafkaTopic resources in the gitops repo, never by
# the application.
spring.kafka.admin.auto-create=false

# Consumer group: every replica of this service shares the work; each
# partition is read by one replica at a time. Offsets are committed only
# after a record was handled or parked in its dead-letter topic
# (at-least-once delivery).
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.consumer.max-poll-records=100
# Values are read as raw bytes and decoded by EventParser (Avro, writer's
# schema from the registry), so a record that fails is parked in its
# dead-letter topic byte for byte, replayable as it was.
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.listener.concurrency=${APP_LISTENER_CONCURRENCY:1}
# Listener and consumer metrics (consumer lag per partition, records
# consumed) in /actuator/prometheus.
spring.kafka.listener.observation-enabled=true

# Dead-letter publishing: the original bytes, waiting for all in-sync
# replicas, never duplicated.
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

app.notifications.topics=orders,users
# Where record schemas are looked up (gitops streaming/base/schema-registry.yaml).
app.notifications.schema-registry-url=${SCHEMA_REGISTRY_URL:http://schema-registry.kafka.svc:8080/apis/ccompat/v7}
# Retries for a failure that may pass (a mail server timing out): 1s, 2s, 4s,
# then the record goes to <topic>-dlq so it stops blocking its partition.
app.notifications.retry.initial-interval=1s
app.notifications.retry.multiplier=2
app.notifications.retry.max-attempts=4
# Share of sends that fail on purpose, for the step-12 exercises (retries,
# dead-letter topic). 0 in every real environment.
app.notifications.simulated-failure-rate=0
