plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
	// The Avro deserializer that talks to the schema registry (Apache 2.0).
	maven { url = uri('https://packages.confluent.io/maven/') }
}

dependencies {
	// The web server only serves actuator (health probes, Prometheus metrics);
	// the service's work comes from Kafka.
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.kafka:spring-kafka'
	// 7.8.x: the line built against kafka-clients 3.8 (Spring Boot 3.4's).
	implementation 'io.confluent:kafka-avro-serializer:7.8.9'
	// Amazon MSK's IAM sign-in (roadmap step 14): used only where the
	// environment points the service at MSK (gitops chart kafka.msk).
	runtimeOnly 'software.amazon.msk:aws-msk-iam-auth:2.3.9'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
